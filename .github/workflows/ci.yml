name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    # Build doesn't call the API at build time, but next/image's remote
    # config and a few modules read NEXT_PUBLIC_* at build time — dummy
    # values are enough to get a representative production build without
    # needing real secrets for CI.
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_APP_NAME: SproutVest
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXT_PUBLIC_R2_URL: https://cdn.example.com
      NEXT_PUBLIC_PUSHER_KEY: ci-placeholder
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: "8080"
      NEXT_PUBLIC_REVERB_SCHEME: http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build